<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f2d57">
  <title>Smart Pressing</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="top" id="top"></header>
  <main id="view"></main>
  <nav class="nav" id="nav"></nav>
  <div id="toast"></div>
  <script>
    // Affiche toute erreur de démarrage au lieu d'un écran vide.
    function spShowError(msg) {
      var v = document.getElementById('view');
      if (v && !v.children.length) v.innerHTML = '<div class="flash err">Erreur au démarrage : ' + String(msg).replace(/</g, '&lt;') + '</div>';
    }
    window.addEventListener('error', function (e) { spShowError(e.message || e); });
    window.addEventListener('unhandledrejection', function (e) { spShowError((e.reason && e.reason.message) || e.reason); });
  </script>
  <script src="vendor/capacitor.js"></script>
  <script src="vendor/jspdf.umd.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
