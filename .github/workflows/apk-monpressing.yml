name: Construire l'APK MonPressing

on:
  push:
    branches: [main]
    paths: ["monpressing/**", ".github/workflows/apk-monpressing.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monpressing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Dépendances
        run: npm ci
      - name: Copier l'appli dans le projet Android
        run: npx cap sync android
      - name: Compiler l'APK
        working-directory: monpressing/android
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renommer
        run: cp android/app/build/outputs/apk/release/app-release.apk MonPressing.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MonPressing-apk
          path: monpressing/MonPressing.apk
      - name: Publier dans « Releases »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: monpressing-v1.0.${{ github.run_number }}
          name: MonPressing 1.0.${{ github.run_number }}
          body: Téléchargez MonPressing.apk sur le téléphone Android et ouvrez-le pour l'installer.
          files: monpressing/MonPressing.apk
          # Smart Pressing reste la version « Latest » de la page Releases
          make_latest: false
